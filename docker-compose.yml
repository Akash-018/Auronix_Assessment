version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pixeltest-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pixeltest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixeltest"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixeltest-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pixeltest
      - JWT_SECRET=super-secret-pixeltest-key-change-in-production-32bytes
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - STORAGE_PROVIDER=local
      - STORAGE_BUCKET=pixeltest-uploads
      - ENVIRONMENT=production
      - INITIAL_ADMIN_EMAIL=admin@pixeltest.com
      - INITIAL_ADMIN_PASSWORD=AdminPassword123!
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
