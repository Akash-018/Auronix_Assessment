# Render blueprint — web service only.
#
# The database is NOT provisioned here on purpose. Render's free PostgreSQL plan
# expires 30 days after creation and is then suspended, which is what took this
# deployment down. Point DATABASE_URL at an external provider whose free tier does
# not expire (Neon is the recommended one — see README "Database hosting").
#
# DATABASE_URL is marked `sync: false`, so Render prompts for it in the dashboard
# and keeps it out of this file and out of git.
services:
  - type: web
    name: pixeltest-web
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: STORAGE_PROVIDER
        value: local
      - key: ENVIRONMENT
        value: production
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
