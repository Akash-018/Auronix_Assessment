services:
  - type: web
    name: pixeltest-web
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pixeltest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: STORAGE_PROVIDER
        value: local
      - key: ENVIRONMENT
        value: production
      - key: INITIAL_ADMIN_EMAIL
        value: admin@pixeltest.com
      - key: INITIAL_ADMIN_PASSWORD
        value: AdminPassword123!

databases:
  - name: pixeltest-db
    plan: free
    databaseName: pixeltest
    user: pixeltest_user
